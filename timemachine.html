<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DF Time Machine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>Digital Foundry <span class="highlight">Time Machine</span></h1>
    <div class="controls">
        <label for="base-date">Travel to date:</label>
        <input type="date" id="base-date">
        <button id="update-btn">Warp</button>
    </div>
</header>

    <main id="app">
        <section class="time-block" id="one-year">
            <h2>1 Year Ago (2025)</h2>
            <div class="video-grid" id="grid-1"></div>
        </section>

        <section class="time-block" id="five-years">
            <h2>5 Years Ago (2021)</h2>
            <div class="video-grid" id="grid-5"></div>
        </section>

        <section class="time-block" id="ten-years">
            <h2>10 Years Ago (2016)</h2>
            <div class="video-grid" id="grid-10"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
